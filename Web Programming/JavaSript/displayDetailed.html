<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #userContainer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .user {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px gray;
        }

        .user h2 {
            color: #333;
        }

        .user p {
            margin: 8px 0;
        }

        .address {
            background-color: #eeeeee;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
        }

        .company {
            background-color: #e8f5e9;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
        }

    </style>
</head>
<body>

    <h1>User Details</h1>

    <!-- Button -->
    <button onclick="getUsers()">
        Load Users
    </button>

    <!-- Users will be displayed here -->
    <div id="userContainer"></div>

    
    <script>

        const url = "https://jsonplaceholder.typicode.com/users";

        async function getUsers(){
            const response = await fetch(url);
            const users = await response.json();

            displayUsers(users);
        }

        function displayUsers(users) {
            const container =
                document.getElementById("userContainer");

                container.innerHTML = "";
        


        users.forEach(user => {

                const div = document.createElement("div");

                div.className = "user";

                div.innerHTML = `

                    <h2>${user.name}</h2>

                    <p>
                        <strong>ID:</strong>
                        ${user.id}
                    </p>

                    <p>
                        <strong>Username:</strong>
                        ${user.username}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${user.email}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${user.phone}
                    </p>

                    <p>
                        <strong>Website:</strong>
                        ${user.website}
                    </p>

                    <div class="address">

                        <h3>Address</h3>

                        <p>
                            <strong>Street:</strong>
                            ${user.address.street}
                        </p>

                        <p>
                            <strong>City:</strong>
                            ${user.address.city}
                        </p>

                        <p>
                            <strong>Zipcode:</strong>
                            ${user.address.zipcode}
                        </p>

                    </div>

                    <div class="company">

                        <h3>Company</h3>

                        <p>
                            <strong>Name:</strong>
                            ${user.company.name}
                        </p>

                        <p>
                            <strong>Catch Phrase:</strong>
                            ${user.company.catchPhrase}
                        </p>

                    </div>

                `;

                container.appendChild(div);

            });
        }
        
    </script>
</body>
</html>

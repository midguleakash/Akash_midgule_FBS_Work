<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Student List</h1>
    <button>Get Student List</button>

    <ol id="slist"></ol>
    

    <script>
        let slist = document.querySelector("#slist");
        let students = ["akash", "mahesh", "swapnil", "ranjiit"];

        document.querySelector("button").addEventListener("click", function(){
            students.forEach(function(ele){
                slist.innerHTML += "<li>" + ele + "</li>";
            })
        })
    </script>
</body>
</html>

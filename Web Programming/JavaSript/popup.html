<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    #popup {
        display: none;
        width: 300px;
        padding: 20px;
        background: wheat;
        border: 2px solid darkmagenta;
        position: fixed;
        top: 30%;
        left: 40%;
    }
</style>
<body>
    <h1>my website</h1>

    <div id="popup">
        <h2>welcome</h2>
        <p>this is popup</p>
        <button onclick="closePopup()">X</button>
    </div>


    <script>
        setTimeout(function(){
            document.getElementById("popup").style.display="block";
        },3000);


        function closePopup(){
            document.getElementById("popup").style.display="none";
        }
    </script>
    
</body>
</html>

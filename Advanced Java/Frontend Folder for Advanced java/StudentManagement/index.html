<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        form {
            width: 500px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 8px;
            margin: 6px 0 15px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 25px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #studentResult {
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: lightgray;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Add Student</h1>

    <form id="studentForm">

        <h2>Student Details</h2>

        <label>FRN</label>
        <input type="text" id="frn" required>

        <label>Name</label>
        <input type="text" id="name" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Mobile Number</label>
        <input type="number" id="mobno" required>


        <h2>Address Details</h2>

        <label>Address ID</label>
        <input type="number" id="addressId" required>

        <label>Pincode</label>
        <input type="number" id="pincode" required>

        <label>Lane No</label>
        <input type="text" id="laneno" required>

        <label>House No</label>
        <input type="text" id="houseno" required>

        <label>City</label>
        <input type="text" id="city" required>

        <label>State</label>
        <input type="text" id="state" required>


        <h2>Batch</h2>

        <label>Select Batch</label>

        <select id="batch" required>
            <option value="">-- Select Batch --</option>
        </select>

        <button type="submit">Add Student</button>

    </form>

    <hr>

    <h1>Get Students By City</h1>

    <form id="citySearchForm">

        <label>Enter City</label>

        <input type="text" id="searchCity" placeholder="Enter city, for example shirur" required>

        <button type="submit">
            Search Students
        </button>

    </form>

    <div id="studentResult"></div>


    <script>

        // Load batch list
        function loadBatches() {

            fetch("http://localhost:8080/StudentManagement/batch/getallbatch")
                .then(response => response.json())
                .then(batches => {

                    const batchSelect = document.querySelector("#batch");

                    batches.forEach(batch => {

                        const option = document.createElement("option");

                        option.value = batch.batchId;
                        option.textContent =
                            batch.batchId + " - " + batch.batchName;

                        batchSelect.appendChild(option);
                    });

                })
                .catch(error => {
                    console.log("Error loading batches:", error);
                });
        }


        // Add Student
        document.querySelector("#studentForm")
            .addEventListener("submit", function (event) {




                const student = {

                    frn: document.querySelector("#frn").value,

                    name: document.querySelector("#name").value,

                    dob: document.querySelector("#dob").value,

                    mobno: Number(
                        document.querySelector("#mobno").value
                    ),

                    address: {

                        id: Number(
                            document.querySelector("#addressId").value
                        ),

                        pincode: Number(
                            document.querySelector("#pincode").value
                        ),

                        laneno: document.querySelector("#laneno").value,

                        houseno: document.querySelector("#houseno").value,

                        city: document.querySelector("#city").value,

                        state: document.querySelector("#state").value
                    },

                    batch: {

                        batchId: document.querySelector("#batch").value

                    }
                };


                console.log(student);


                fetch("http://localhost:8080/StudentManagement/student/addstudent", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(student)

                })
                    .then(response => {

                        if (!response.ok) {
                            throw new Error("Failed to add student");
                        }

                        return response.text();

                    })
                    .then(data => {

                        alert("Student added successfully!");

                        document.querySelector("#studentForm").reset();

                    })
                    .catch(error => {

                        console.log(error);

                        alert("Error adding student");

                    });

            });




        // Call when page loads
        loadBatches();



        // Get Students By City
        document.querySelector("#citySearchForm")
            .addEventListener("submit", function (event) {

                // Prevent page reload
                event.preventDefault();

                const city =
                    document.querySelector("#searchCity").value.trim();

                if (city === "") {
                    return;
                }

                const url =
                    "http://localhost:8080/StudentManagement/student/getstudentsbycity?city="
                    + encodeURIComponent(city);

                fetch(url)
                    .then(response => {

                        if (!response.ok) {
                            throw new Error("Failed to fetch students");
                        }

                        return response.json();
                    })
                    .then(students => {

                        displayStudents(students);
                    })
                    .catch(error => {

                        console.log("Error:", error);

                        document.querySelector("#studentResult").innerHTML =
                            "<p class='error'>Error fetching students</p>";
                    });
            });


        // Display DTO data in table
        function displayStudents(students) {

            const resultDiv =
                document.querySelector("#studentResult");

            if (students.length === 0) {

                resultDiv.innerHTML =
                    "<p>No students found for this city.</p>";

                return;
            }

            let table = `
        <h2>Students Found</h2>

        <table>
            <thead>
                <tr>
                    <th>FRN</th>
                    <th>Name</th>
                    <th>City</th>
                    <th>State</th>
                </tr>
            </thead>

            <tbody>
    `;

            students.forEach(student => {

                table += `
            <tr>
                <td>${student.frn}</td>
                <td>${student.name}</td>
                <td>${student.city}</td>
                <td>${student.state}</td>
            </tr>
        `;
            });

            table += `
            </tbody>
        </table>
    `;

            resultDiv.innerHTML = table;
        }

    </script>

</body>

</html>
